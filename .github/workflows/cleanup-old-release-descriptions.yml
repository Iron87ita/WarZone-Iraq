name: Clean old WarZone Iraq release descriptions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-release-descriptions.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Clear descriptions of v3.0 and v2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          
          snapshot = json.loads("{\"latest\":{\"id\":440416490,\"body\":\"WarZone Iraq v3.0.1 is a land-based DCS World campaign with all six sectors active from mission start. The opening front is Qayyarah / Kirkuk (S3).\\n\\n## Changes\\n\\n- Removed USS John C. Stennis, the two NATO escorts, their naval zones and the carrier aircraft slots.\\n- Updated the English mission briefing, briefing image and all six English kneeboard pages.\\n- Aligned the player guides with the current sector, airfield and FARP setup.\\n\\nDownload the mission file and copy it into the Missions folder in your DCS profile. The release includes a SHA-256 checksum.\"},\"targets\":[{\"id\":440269073,\"tag\":\"v3.0\",\"body\":\"WarZone Iraq V3.0 for DCS World. Download WarZone_IRAQ_IRON87_V3.0.miz and copy it to the Missions folder in your DCS profile. The SHA-256 checksum is included with the download.\"},{\"id\":436782347,\"tag\":\"v2.0\",\"body\":\"![WarZone Iraq](https://raw.githubusercontent.com/Iron87ita/WarZone-Iraq/main/bannerCampaign.png)\\r\\n\\r\\n# WarZone Iraq v2.0\\r\\n\\r\\n**DCS World · Iraq · Modern dynamic sector campaign · IRON87ITA**\\r\\n\\r\\n## Update · All sectors operational\\r\\n\\r\\n[Download the updated mission](https://github.com/Iron87ita/WarZone-Iraq/releases/download/v2.0/WarZone_IRAQ_IRON87_V2.0_SETTORI_ATTIVI.miz)\\r\\n\\r\\n- All six sectors are operational from mission start. The F10 sector and AI controls are available.\\r\\n- Ground columns get a route at spawn and retry with an alternate route if they stall. Combat flights get their routes before departure.\\r\\n- Existing campaign saves are supported.\\r\\n\\r\\nSHA-256 for `WarZone_IRAQ_IRON87_V2.0_SETTORI_ATTIVI.miz`\\r\\n\\r\\n```text\\r\\ne53f3a32bde19f20c643f791f08814e87096515a93725511153e58757e2f64db\\r\\n```\\r\\n\\r\\n## Original v2.0 package\\r\\n\\r\\n- Mission: `WarZone_IRAQ_IRON87_V2.0_NORTH_BLUE_SOUTH_RED.miz`\\r\\n- North BLUE / South RED campaign, with six progressive sectors.\\r\\n- F10 missions, coalition AI controls, logistics and EWR emplacement rules remain documented in the repository guides.\\r\\n- Updated English and Italian overview, installation download references and package checksums.\\r\\n- The previous V1.0 package remains available in the repository and its history.\\r\\n\\r\\n## Installation\\r\\n\\r\\nDownload `WarZone_IRAQ_IRON87_V2.0_SETTORI_ATTIVI.miz` from the release assets and place it in your DCS Saved Games `Missions` folder, or add it to your dedicated server mission list. Requirements and unit-mod references are listed in [INSTALLATION.md](https://github.com/Iron87ita/WarZone-Iraq/blob/main/INSTALLATION.md).\\r\\n\\r\\nFor an ongoing campaign, stop the mission and back up the existing save before switching packages. The embedded campaign still uses `Missions/Saves/Modern/WarZone_IRAQ_MODERN_V448_NORTH_BLUE_SOUTH_RED.lua`.\\r\\n\\r\\n## Original package integrity\\r\\n\\r\\nSHA-256 for `WarZone_IRAQ_IRON87_V2.0_NORTH_BLUE_SOUTH_RED.miz`\\r\\n\\r\\n```text\\r\\nf4286174de6a8bcc3627f9753660f24228460c56d2a40eb9634b391b121ac7b7\\r\\n```\\r\\n\\r\\nNo DCS gameplay session or test suite was run for this publication.\\r\\n\\r\\n## Italiano\\r\\n\\r\\nScarica [WarZone Iraq v2.0 con tutti i settori attivi](https://github.com/Iron87ita/WarZone-Iraq/releases/download/v2.0/WarZone_IRAQ_IRON87_V2.0_SETTORI_ATTIVI.miz). La missione aggiorna le rotte delle colonne di terra e dei voli da combattimento. La prima versione della v2.0 resta tra gli allegati. Per una campagna in corso, ferma la missione e fai una copia del salvataggio prima di usare il file aggiornato.\\r\\n\"}]}")
          base_url = "https://api.github.com/repos/Iron87ita/WarZone-Iraq"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(base_url + path, data=data, headers=headers,
                                           method="GET" if payload is None else "PATCH")
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          
          latest = request("/releases/latest")
          assert latest["id"] == snapshot["latest"]["id"], "Latest release changed"
          assert latest["body"] == snapshot["latest"]["body"], "Latest description changed"
          for target in snapshot["targets"]:
              current = request("/releases/" + str(target["id"]))
              assert current["tag_name"] == target["tag"], "Release tag changed"
              assert current["body"] in (target["body"], "", None), "Description changed since review"
          
          for target in snapshot["targets"]:
              result = request("/releases/" + str(target["id"]), {"body": ""})
              assert not result.get("body"), "Description was not cleared"
              print("Cleared description for " + target["tag"])
          
          latest = request("/releases/latest")
          assert latest["id"] == snapshot["latest"]["id"]
          assert latest["body"] == snapshot["latest"]["body"]
          print("Verified the latest release description")
          
